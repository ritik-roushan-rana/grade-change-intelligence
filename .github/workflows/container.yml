# Builds the deployment image, proves it actually serves the app, and publishes
# it so any container host can pull a known-good artifact.
#
# The smoke test is the point of this workflow. A Docker build succeeding only
# proves the layers assembled; it says nothing about whether the models load or
# the React bundle is reachable. So the container is started and probed the same
# way a host's health check would probe it.

name: Container

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build, smoke-test, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build to a local image first. Publishing happens only after the
      # container has been shown to serve traffic.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gci:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name gci -p 8000:8000 gci:ci
          echo "Waiting for model warm-up (~25s)..."
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Ready after ${i} attempts."
              exit 0
            fi
            sleep 3
          done
          echo "Service never became ready." >&2
          docker logs gci >&2
          exit 1

      - name: Probe API
        run: |
          set -euo pipefail
          health=$(curl -fsS http://127.0.0.1:8000/api/health)
          echo "health: $health"
          echo "$health" | grep -q '"status":"ready"'
          echo "$health" | grep -q '"events":119'

          # Every endpoint the UI depends on, including one scored prediction
          # and its recommendations, so the models are proven to run in-image.
          for path in \
            "/api/events" \
            "/api/events/46/timeline" \
            "/api/events/46/predict?t=180" \
            "/api/events/46/projection?t=180" \
            "/api/events/46/recommendations?t=180" \
            "/api/correlations" \
            "/api/recipe-limits/Grade-B-Std?event_id=46&t=180" \
            "/api/optimal-setpoints/Grade-B-Std" \
            "/api/feedback" \
            "/api/model-info"
          do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000${path}")
            echo "  ${code}  ${path}"
            [ "$code" = "200" ] || exit 1
          done

      - name: Verify held-out metrics are unchanged
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/api/model-info \
            | python3 -c '
import json,sys
e=json.load(sys.stdin)["evaluation"]
expected={"test_accuracy":0.945,"test_f1":0.881,"test_r2":0.985}
for key,want in expected.items():
    got=e[key]
    print(f"  {key}: {got} (expected {want})")
    assert got==want, f"{key} drifted: {got} != {want}"
print("Metrics match the validated model.")'

      - name: Probe served frontend
        run: |
          set -euo pipefail
          # Client-side routes must return the shell, not a 404.
          for path in "/" "/correlations" "/events" "/feedback"; do
            out=$(curl -s -o /dev/null -w '%{http_code} %{content_type}' \
              "http://127.0.0.1:8000${path}")
            code=${out%% *}
            type=${out#* }
            echo "  ${code}  ${type}  ${path}"
            [ "$code" = "200" ] || exit 1
            case "$type" in text/html*) ;; *) echo "expected HTML" >&2; exit 1 ;; esac
          done

          # An unknown API path must stay JSON, so a client sees the real status
          # instead of failing later on HTML it cannot parse.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/nope)
          echo "  ${code}  /api/nope (expect 404)"
          [ "$code" = "404" ] || exit 1

          # The hashed bundle referenced by index.html must actually be served.
          asset=$(curl -fsS http://127.0.0.1:8000/ \
            | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          echo "  bundle: ${asset}"
          [ -n "$asset" ] || exit 1
          curl -fsS -o /dev/null "http://127.0.0.1:8000${asset}"

      - name: Report resource profile
        if: always()
        run: |
          docker stats --no-stream --format '  {{.Name}}: mem {{.MemUsage}} cpu {{.CPUPerc}}' gci || true
          docker logs gci 2>&1 | tail -20

      - name: Stop container
        if: always()
        run: docker rm -f gci || true

      # Only main publishes. A pull request gets the same verification without
      # moving the tag that hosts deploy from.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
