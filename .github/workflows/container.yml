# Builds the deployment image, proves it serves the app, publishes it, and then
# proves the published artifact serves the app too.
#
# A Docker build succeeding only shows the layers assembled; it says nothing
# about whether the models load or the React bundle is reachable. Both jobs
# therefore run scripts/smoke_test.sh, the same check you can point at a live
# deployment — so CI and a post-deploy check cannot drift apart.

name: Container

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build, smoke-test, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build to a local image first. Publishing happens only after the
      # container has been shown to serve traffic.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gci:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name gci -p 8000:8000 gci:ci

      - name: Smoke-test the built image
        run: ./scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Report resource profile
        if: always()
        run: |
          docker stats --no-stream --format '  {{.Name}}: mem {{.MemUsage}} cpu {{.CPUPerc}}' gci || true
          docker logs gci 2>&1 | tail -20

      - name: Stop container
        if: always()
        run: docker rm -f gci || true

      # Only main publishes. A pull request gets the same verification without
      # moving the tag that hosts deploy from.
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-published:
    name: Verify the published image
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    # The build job probes an image it holds locally, then publishes a separate
    # build invocation. Pulling the tag back from the registry and probing that
    # is what actually proves the artifact a host will deploy is sound.
    steps:
      - uses: actions/checkout@v4

      - name: Pull the published image
        run: |
          docker pull ${{ env.IMAGE }}:${{ github.sha }}
          docker image inspect ${{ env.IMAGE }}:${{ github.sha }} \
            --format '  digest: {{index .RepoDigests 0}}{{"\n"}}  size:   {{.Size}} bytes'

      - name: Start the published image
        run: docker run -d --name gci-pub -p 8000:8000 ${{ env.IMAGE }}:${{ github.sha }}

      - name: Smoke-test the published image
        run: ./scripts/smoke_test.sh http://127.0.0.1:8000

      - name: Report resource profile
        if: always()
        run: |
          docker stats --no-stream --format '  {{.Name}}: mem {{.MemUsage}} cpu {{.CPUPerc}}' gci-pub || true
          docker logs gci-pub 2>&1 | tail -10

      - name: Stop container
        if: always()
        run: docker rm -f gci-pub || true
