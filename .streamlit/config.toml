# Streamlit configuration for the Grade Change Intelligence dashboard.
#
# The dashboard's custom CSS in app.py is built for a dark surface
# (#0e1117 sidebar, #161b22 cards, light text). Streamlit serves the light
# theme by default, which would leave that CSS unreadable, so the dark base
# is pinned here rather than left to the viewer's local preference.

[theme]
base = "dark"
primaryColor = "#58a6ff"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#161b22"
textColor = "#e6edf3"

[server]
headless = true
# The timeseries CSV is ~6.4 MB; the dashboard only reads bundled data and
# never accepts uploads, so keep the upload ceiling small.
maxUploadSize = 10

[browser]
gatherUsageStats = false
